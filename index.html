<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Financial Independence</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#eef2f7;--ink:#14213d;--mut:#64708a;--card:#fff;--ok:#0b7a75;--warn:#c77700;--bad:#d62839;--line:#dde3ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:0 auto;padding:16px}h1{margin:8px 0 0;font-size:28px}h3{margin:0 0 12px}.m{color:var(--mut);font-size:14px}
input,select,textarea{width:100%;font:inherit;padding:13px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.btn{display:block;width:100%;padding:15px;margin:10px 0;border:0;border-radius:14px;background:var(--ink);color:#fff;font:600 17px system-ui;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}.btn.add{background:var(--ok);font-size:20px;padding:19px}.btn.hun{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.lnk{background:none;border:0;color:var(--mut);padding:10px;width:100%;font:inherit;text-decoration:underline}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.big{font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:6px}
.bar{position:relative;height:12px;background:#e7ecf3;border-radius:6px;margin:12px 0 6px}.bar i{display:block;height:100%;border-radius:6px}.bar u{position:absolute;top:-4px;width:3px;height:20px;background:var(--ink);border-radius:2px}
.warn{background:#fff4e0;color:#8a5200;border-radius:10px;padding:9px 11px;margin-top:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips span{background:var(--bg);border-radius:20px;padding:5px 10px;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center}.top select{width:auto;margin:0}.ic{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:18px;padding:8px 11px;margin-left:6px}
.ic em{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:10px;font:600 11px system-ui;padding:2px 6px}
.ov{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:flex-end;z-index:5}.sh{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:2px solid var(--line);border-radius:14px;background:#fff;font:inherit;color:var(--ink)}.opt b{display:block}.opt span{color:var(--mut);font-size:14px}.opt.rec{border-color:var(--ok);background:#e9f6f5}
.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.x{background:none;border:0;color:var(--bad);font-size:18px}
.toast{position:fixed;left:16px;right:16px;bottom:24px;background:var(--bad);color:#fff;padding:13px;border-radius:12px;z-index:9;text-align:center}.or{text-align:center;color:var(--mut);margin:14px 0 4px}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== PASTE YOUR TWO SUPABASE VALUES HERE ======
const SB_URL="https://gwvahlsiugpspksehwre.supabase.co", SB_KEY="sb_publishable_J76Th3NdXvRkoZdjW48sBg_rxvCjvCd";
// =================================================
const db=supabase.createClient(SB_URL,SB_KEY);
const CATS=["Food","Transport","Essentials","Clothing","Education","Entertainment","Subscriptions","Other"];
const BASEFOOD=["Matbakh / cheap meal","Restaurant","Snack / Drink","Other"];
// each person's own meal plan: {"Chicken":3,"Fish":1,"Beef":2}. Older saved plans (chicken/fish columns) still work.
const planOf=b=>{const p={};if(b?.food_plan&&typeof b.food_plan=="object"){Object.entries(b.food_plan).forEach(([k,v])=>{if(v!=null)p[k]=Number(v)})}else{if(b?.chicken_plan!=null)p.Chicken=Number(b.chicken_plan);if(b?.fish_plan!=null)p.Fish=Number(b.fish_plan)}return p};
let HF=[];
const PRESETS=["You're spending a little too fast this month.","Slow down on the spending 😂","Check your budget before spending more."];
const $=s=>document.querySelector(s),app=$("#app");
const LOGO=s=>`<svg width="${s}" height="${s}" viewBox="0 0 512 512" role="img" aria-label="Financial Independence"><rect width="512" height="512" rx="112" fill="#14213d"/><circle cx="202" cy="256" r="118" fill="#2ec4b6"/><circle cx="310" cy="256" r="118" fill="#f4b942"/><path d="M256 151.08A118 118 0 0 1 256 360.92A118 118 0 0 1 256 151.08Z" fill="#fff"/><path d="M256 330V196M212 238L256 194L300 238" fill="none" stroke="#14213d" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const aed=n=>"AED "+Math.round(n).toLocaleString("en-US");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ym=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const NOW=new Date(),CUR=ym(NOW);
const mlabel=m=>{const[y,mo]=m.split("-");return new Date(y,mo-1).toLocaleString("en",{month:"long",year:"numeric"})};
let S={user:null,room:null,roomId:null,people:[],budgets:[],exp:[],rem:[],loans:[],reqs:[],pending:null,hostId:null,plan:[],month:CUR,view:"home",sheet:null,pid:null,signup:false,join:new URLSearchParams(location.search).get("join")||""};
const uname=()=>S.people.find(p=>p.id==S.user.id)?.name||S.user.user_metadata?.name||"Me";
const others=()=>S.people.filter(p=>p.id!=S.user.id),MAX=6;
function flash(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}

async function load(){
 const{data:rq}=await db.from("join_requests").select("*");S.reqs=rq||[];S.pending=S.reqs.find(x=>x.user_id==S.user.id)||null;
 const{data:mem}=await db.from("members").select("room_id,user_id,profiles(name)");
 const mine=(mem||[]).find(m=>m.user_id==S.user.id);
 if(!mine){S.room=null;S.people=[];return}
 const{data:r}=await db.from("rooms").select("code,created_by").eq("id",mine.room_id).single();
 S.room=r;S.hostId=r.created_by;S.roomId=mine.room_id;S.people=mem.map(m=>({id:m.user_id,name:m.profiles?.name||"Friend"}));
 const ids=S.people.map(p=>p.id);
 const[b,e,rm,lo]=await Promise.all([
  db.from("budgets").select("*").in("user_id",ids),
  db.from("expenses").select("*").in("user_id",ids).order("spent_on",{ascending:false}).order("created_at",{ascending:false}),
  db.from("reminders").select("*").order("created_at",{ascending:false}),
  db.from("loans").select("*").order("created_at",{ascending:false})]);
 S.budgets=b.data||[];S.exp=e.data||[];S.rem=rm.data||[];S.loans=lo.data||[];
}
function stats(uid,m){
 const b=S.budgets.find(x=>x.user_id==uid&&x.month==m),ex=S.exp.filter(x=>x.user_id==uid&&x.month==m);
 const spent=ex.reduce((a,x)=>a+Number(x.amount),0),cat={},ft={};
 ex.forEach(x=>{cat[x.category]=(cat[x.category]||0)+Number(x.amount);if(x.category=="Food"&&x.food_type)ft[x.food_type]=(ft[x.food_type]||0)+1});
 const budget=b?Number(b.amount):0,[y,mo]=m.split("-").map(Number),dim=new Date(y,mo,0).getDate();
 const day=m==CUR?NOW.getDate():m<CUR?dim:0,elapsed=day/dim*100,pct=budget?spent/budget*100:0;
 const food=cat.Food||0,fb=b?.food_budget?Number(b.food_budget):0,w=[];
 if(m==CUR&&budget&&spent>0&&pct>elapsed+10)w.push("⚠️ You're spending faster than planned ("+Math.round(pct)+"% spent, "+Math.round(elapsed)+"% of the month gone)");
 if(budget&&spent>budget)w.push("⚠️ Over the monthly budget");
 if(m==CUR&&fb&&food/fb*100>elapsed+10)w.push("🍽️ Food spending is high for this point in the month");
 const plan=planOf(b);
 Object.entries(plan).forEach(([k,pl])=>{if((ft[k]||0)>pl)w.push("🍽️ "+k+" is over plan ("+ft[k]+"/"+pl+")")});
 return{b,ex,plan,spent,cat,ft,budget,rem:budget-spent,pct,elapsed,food,fb,dim,day,w};
}
const months=()=>{const s=new Set([CUR]);S.budgets.forEach(b=>s.add(b.month));S.exp.forEach(e=>s.add(e.month));return[...s].sort().reverse()};

/* ---------- views ---------- */
function authV(){const su=S.signup;return`<div class="wrap">${LOGO(88)}<h1 style="margin-top:14px">Financial Independence</h1><p class="m">Spend smart, together.</p>
${su?`<input id="nm" placeholder="Your name" maxlength="30">`:""}<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${su?"new":"current"}-password">
<button class="btn" onclick="auth()">${su?"Create account":"Log in"}</button><button class="lnk" onclick="S.signup=!S.signup;render()">${su?"I already have an account":"Create an account"}</button></div>`}
function waitV(){return`<div class="wrap">${LOGO(64)}<h1 style="margin-top:12px">Waiting for approval</h1><p class="m">Your request to join was sent. The host needs to approve it. This screen updates by itself.</p><button class="btn" onclick="recheck()">Check again</button><button class="btn alt" onclick="cancelReq()">Cancel request</button><button class="lnk" onclick="out()">Log out</button></div>`}
function roomV(){return`<div class="wrap">${LOGO(64)}<h1 style="margin-top:12px">Hi ${esc(uname())} 👋</h1><p class="m">Create a private room, or join your friend's.</p>
<button class="btn" onclick="mkRoom()">Create a room</button><div class="or">or join with a code</div>
<input id="code" placeholder="Room code" maxlength="8" value="${esc(S.join)}" style="text-transform:uppercase"><button class="btn alt" onclick="joinRoom()">Join room</button><button class="lnk" onclick="out()">Log out</button></div>`}
function planForm(){const me=S.user.id,b=stats(me,CUR).b||S.budgets.filter(x=>x.user_id==me).sort((a,c)=>c.month.localeCompare(a.month))[0]||{};const v=x=>x==null?"":x;
S.plan=Object.entries(planOf(b)).map(([n,c])=>({n,c:String(c)}));if(!S.plan.length)S.plan=[{n:"Chicken",c:""},{n:"Fish",c:""}];
return`<input id="bud" type="number" inputmode="decimal" placeholder="Monthly budget (AED)" value="${v(b.amount)}">
<input id="fb" type="number" inputmode="decimal" placeholder="Food budget (optional)" value="${v(b.food_budget)}">
<p class="m" style="margin:12px 0 4px"><b>My meal plan for this month</b><br>Your own list and how many times. These are goals, not limits.</p>
<div id="prow">${planRows()}</div>
<button class="lnk" onclick="addMeal()">＋ Add another meal</button>
<button class="btn" onclick="savePlan()">Save</button>`}
const planRows=()=>S.plan.map((r,i)=>`<div style="display:flex;gap:6px;align-items:center"><input placeholder="Meal (e.g. Beef)" maxlength="20" value="${esc(r.n)}" oninput="S.plan[${i}].n=this.value" style="flex:2"><input type="number" inputmode="numeric" min="0" max="99" placeholder="Times" value="${esc(r.c)}" oninput="S.plan[${i}].c=this.value" style="flex:1"><button class="x" onclick="delMeal(${i})">✕</button></div>`).join("");
const addMeal=()=>{S.plan.push({n:"",c:""});$("#prow").innerHTML=planRows()};
const delMeal=i=>{S.plan.splice(i,1);$("#prow").innerHTML=planRows()};
function card(p,s,mine){
 const col=s.pct>100?"var(--bad)":s.pct>s.elapsed+10?"var(--warn)":"var(--ok)";
 const cats=Object.entries(s.cat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<span>${esc(c)} ${aed(v)}</span>`).join("");
 return`<div class="card" onclick="S.pid='${p.id}';S.view='p';render()">
 <div class="row"><b>${esc(p.name)}${mine?" (you)":""}</b><span class="m">Budget ${aed(s.budget)}</span></div>
 <div class="big" style="${mine?"":"font-size:34px"}">${aed(s.rem)}</div><div class="m">remaining</div>
 <div class="bar"><i style="width:${Math.min(100,s.pct)}%;background:${col}"></i><u style="left:calc(${Math.min(100,s.elapsed)}% - 1px)"></u></div>
 <div class="row m"><span>${aed(s.spent)} spent (${Math.round(s.pct)}%)</span><span>${Math.round(s.elapsed)}% of month</span></div>
 ${s.w.map(x=>`<div class="warn">${esc(x)}</div>`).join("")}<div class="chips">${cats}</div>
 ${!mine&&S.month==CUR?`<button class="btn alt" style="padding:11px;font-size:15px" onclick="event.stopPropagation();S.sheet={t:'rem',to:'${p.id}'};render()">Send reminder</button>`:""}</div>`}
function home(){
 const me=S.user.id,os=others(),isHost=S.hostId==me,pend=isHost?S.reqs.filter(r=>r.room_id==S.roomId).length:0,cur=S.month==CUR,unread=S.rem.filter(r=>r.to_user==me&&!r.read).length;
 return`<div class="wrap"><div class="top"><select onchange="S.month=this.value;render()">${months().map(m=>`<option value="${m}" ${m==S.month?"selected":""}>${mlabel(m)}</option>`).join("")}</select>
 <span><button class="ic" onclick="S.sheet={t:'people'};render()">👥${pend?`<em>${pend}</em>`:""}</button><button class="ic" onclick="openInbox()">🔔${unread?`<em>${unread}</em>`:""}</button><button class="ic" onclick="out()">⎋</button></span></div>
 ${card({id:me,name:uname()},stats(me,S.month),1)}
 ${cur?`<button class="btn add" onclick="S.sheet={t:'add'};render()">＋ Add Expense</button><button class="btn hun" onclick="S.sheet={t:'hungry'};render()">🍽️ I'm Hungry</button>`:""}
 ${os.map(p=>card(p,stats(p.id,S.month),0)).join("")}
 ${os.length?loanCard():""}
 ${isHost&&S.people.length<MAX?`<div class="card"><b>${os.length?"Invite another friend":"Waiting for your friend"}</b><p class="m">Room code: <b>${esc(S.room.code)}</b> · ${S.people.length} of ${MAX} joined</p><button class="btn alt" onclick="share()">Share invite link</button></div>`:""}
 ${cur?`<button class="lnk" onclick="S.sheet={t:'plan'};render()">Edit my budget and food plan</button>`:""}</div>`}
function person(){
 const p=S.people.find(x=>x.id==S.pid),mine=p.id==S.user.id,s=stats(p.id,S.month),b=s.b||{};
 const sent=S.rem.filter(r=>r.from_user==p.id&&r.created_at.slice(0,7)==S.month).length,got=S.rem.filter(r=>r.to_user==p.id&&r.created_at.slice(0,7)==S.month).length;
 const plan=(k,u)=>{const pl=b[k+"_plan"];return pl==null?"":`<div class="li"><span>${u}</span><b>${s.ft[u]||0} / ${pl} planned</b></div>`};
 return`<div class="wrap"><button class="lnk" style="text-align:left" onclick="S.view='home';render()">‹ Back</button><h1>${esc(p.name)}${mine?" (you)":""}</h1><p class="m">${mlabel(S.month)}</p>
 <div class="card"><div class="row"><span>Budget</span><b>${aed(s.budget)}</b></div><div class="row"><span>Spent</span><b>${aed(s.spent)}</b></div><div class="row"><span>Remaining</span><b>${aed(s.rem)}</b></div>
 <div class="m" style="margin-top:8px">Reminders sent: ${sent} · received: ${got}</div>${s.w.map(x=>`<div class="warn">${esc(x)}</div>`).join("")}</div>
 <div class="card"><b>By category</b>${Object.entries(s.cat).sort((a,c)=>c[1]-a[1]).map(([c,v])=>`<div class="li"><span>${esc(c)}</span><b>${aed(v)}</b></div>`).join("")||`<p class="m">No expenses yet.</p>`}</div>
 <div class="card"><b>Food</b><div class="li"><span>Food spent</span><b>${aed(s.food)}${s.fb?" of "+aed(s.fb):""}</b></div>${Object.entries(s.plan).map(([k,pl])=>`<div class="li"><span>${esc(k)}</span><b>${s.ft[k]||0} / ${pl} planned</b></div>`).join("")}
 ${Object.keys(s.ft).filter(k=>!(k in s.plan)).map(k=>`<div class="li"><span>${esc(k)}</span><b>${s.ft[k]}×</b></div>`).join("")}</div>
 <div class="card"><b>Expenses</b>${s.ex.map(x=>`<div class="li"><span>${esc(x.spent_on.slice(5))} · ${esc(x.category)}${x.food_type?" · "+esc(x.food_type):""}<br><span class="m">${esc(x.note||"")}</span></span><span><b>${aed(x.amount)}</b>${mine?`<button class="x" onclick="del('${x.id}')">🗑</button>`:""}</span></div>`).join("")||`<p class="m">Nothing yet.</p>`}</div></div>`}
const money=n=>"AED "+(Math.round(n*100)/100).toLocaleString("en-US");
// Net money between us: + means my friend owes me, - means I owe my friend (every entry is money one person handed to the other)
const loanBal=pid=>S.loans.filter(l=>l.from_user==pid||l.to_user==pid).reduce((a,l)=>a+(l.from_user==S.user.id?1:-1)*Number(l.amount),0);
function loanText(l){const me=S.user.id,mine=l.from_user==me,n=esc(mname(mine?l.to_user:l.from_user)),a=money(l.amount);
 return l.kind=="loan"?(mine?`You lent ${n} ${a}`:`${n} lent you ${a}`):(mine?`You paid ${n} back ${a}`:`${n} paid you back ${a}`)}
function loanCard(){return`<div class="card"><b>Money between us</b>${others().map(p=>{
 const b=loanBal(p.id),n=esc(p.name),settled=Math.abs(b)<0.005,col=settled?"var(--ok)":b>0?"var(--ink)":"var(--warn)",
 t=settled?"All settled ✓":b>0?`${n} owes you ${money(b)}`:`You owe ${n} ${money(-b)}`;
 return`<div class="li"><span><b>${n}</b><br><span style="color:${col};font-weight:600">${t}</span></span><span style="display:flex;gap:6px"><button class="ic" style="margin:0;font-size:14px" onclick="S.sheet={t:'loan',to:'${p.id}'};render()">Add</button><button class="ic" style="margin:0;font-size:14px" onclick="S.sheet={t:'loans',to:'${p.id}'};render()">History</button></span></div>`}).join("")}</div>`}
const foodOpts=()=>["Matbakh / cheap meal","Chicken","Fish",...Object.keys(planOf(stats(S.user.id,CUR).b)).filter(k=>k!="Chicken"&&k!="Fish"),"Restaurant","Snack / Drink","Other"];
function sheetV(){
 const t=S.sheet?.t;if(!t)return"";let h="";const me=S.user.id;
 if(t=="people"){const host=S.hostId==me,rq=host?S.reqs.filter(r=>r.room_id==S.roomId):[];
  h=`<h3>People (${S.people.length} of ${MAX})</h3>${rq.map(r=>`<div class="li"><span><b>${esc(r.name)}</b><br><span class="m">wants to join</span></span><span style="display:flex;gap:6px"><button class="ic" style="margin:0;font-size:14px" onclick="approve('${r.user_id}')">Approve</button><button class="ic" style="margin:0;font-size:14px" onclick="decline('${r.user_id}')">Decline</button></span></div>`).join("")}
  ${S.people.map(p=>`<div class="li" onclick="S.sheet=null;S.pid='${p.id}';S.view='p';render()"><span><b>${esc(p.name)}${p.id==me?" (you)":""}${p.id==S.hostId?" · host":""}</b><br><span class="m">Tap to see all months</span></span>${host&&p.id!=me?`<button class="x" style="font-size:14px" onclick="event.stopPropagation();removeMember('${p.id}')">Remove</button>`:""}</div>`).join("")}
  ${host?`<p class="m">Room code: <b>${esc(S.room.code)}</b></p><button class="btn" onclick="share()">Share invite link</button><button class="lnk" onclick="resetCode()">Make a new room code</button>`:""}`}
 if(t=="loan"){const n=esc(mname(S.sheet.to));h=`<h3>Money between you and ${n}</h3><select id="lk"><option value="lend">I lent ${n} money</option><option value="theypay">${n} paid me back</option><option value="borrow">${n} lent me money</option><option value="ipay">I paid ${n} back</option></select>
  <input id="lamt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Amount (AED)"><input id="lnote" maxlength="80" placeholder="Short note (optional)"><button class="btn" onclick="saveLoan()">Save</button><p class="m">${n} sees this too, nobody else does. Partial payments are fine, the balance updates by itself.</p>`}
 if(t=="loans")h=`<h3>History with ${esc(mname(S.sheet.to))}</h3>${S.loans.filter(l=>l.from_user==S.sheet.to||l.to_user==S.sheet.to).map(l=>`<div class="li"><span>${loanText(l)}<br><span class="m">${esc(l.note||"")}${l.note?" · ":""}${new Date(l.created_at).toLocaleDateString("en",{day:"numeric",month:"short"})}</span></span>${l.created_by==me?`<button class="x" onclick="delLoan('${l.id}')">🗑</button>`:""}</div>`).join("")||`<p class="m">Nothing yet.</p>`}`;
 if(t=="add")h=`<h3>Add expense</h3><input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="How much did you spend? (AED)">
  <select id="cat" onchange="$('#ftw').style.display=this.value=='Food'?'block':'none'">${CATS.map(c=>`<option ${c==S.sheet.cat?"selected":""}>${c}</option>`).join("")}</select>
  <div id="ftw" style="display:${S.sheet.cat=="Food"?"block":"none"}"><select id="ft">${foodOpts().map(f=>`<option ${f==S.sheet.food?"selected":""}>${esc(f)}</option>`).join("")}</select></div>
  <input id="note" maxlength="80" placeholder="Short description (optional)"><button class="btn" onclick="saveExp()">Save expense</button>`;
 if(t=="plan")h=`<h3>My budget and food plan</h3>${planForm()}`;
 if(t=="rem")h=`<h3>Send a reminder to ${esc(mname(S.sheet.to))}</h3>${PRESETS.map((p,i)=>`<button class="opt" onclick="sendRem(PRESETS[${i}])">${esc(p)}</button>`).join("")}<textarea id="rmsg" rows="2" maxlength="200" placeholder="Or write your own…"></textarea><button class="btn" onclick="sendRem($('#rmsg').value)">Send</button><p class="m">You can send one reminder per hour to each person.</p>`;
 if(t=="inbox"){const l=S.rem.filter(r=>r.to_user==me);h=`<h3>Reminders for you</h3>${l.map(r=>`<div class="li"><span>${esc(r.message)}<br><span class="m">${esc(mname(r.from_user))} · ${new Date(r.created_at).toLocaleString("en",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}</span></span></div>`).join("")||`<p class="m">No reminders yet.</p>`}`}
 if(t=="hungry"){const s=stats(me,CUR),dl=s.dim-s.day+1,pd=Math.max(0,s.rem/dl),pl=s.plan;HF=[];
  const left=k=>pl[k]==null?null:pl[k]-(s.ft[k]||0);
  const cl=left("Chicken"),customs=Object.keys(pl).filter(k=>k!="Chicken"&&k!="Fish"),fast=s.pct>s.elapsed+10||s.rem<=0,cheap=fast||(cl!=null&&cl<=0);
  const opt=(lv,name,d,f,rec)=>{HF.push(f);return`<button class="opt ${rec?"rec":""}" onclick="S.sheet={t:'add',cat:'Food',food:HF[${HF.length-1}]};render()"><b>${lv}${rec?" · best now":""}</b><span>${esc(name)} — ${d}</span></button>`};
  const note=k=>k==null?"normal option":k>0?k+" planned left":"over your plan";
  h=`<h3>I'm Hungry 🍽️</h3><p class="m">${aed(s.rem)} left · ${dl} days left · about ${aed(pd)} per day${s.fb?` · food: ${aed(s.fb-s.food)} left of ${aed(s.fb)}`:""}</p>
  ${fast?`<div class="warn">⚠️ You're spending faster than planned. A cheap meal helps.</div>`:""}
  ${opt("Cheap","Matbakh","low-cost option","Matbakh / cheap meal",cheap)}${opt("Moderate","Chicken",note(cl),"Chicken",!cheap)}${pl.Fish!=null?opt("Moderate","Fish",note(left("Fish")),"Fish",false):""}${customs.map(k=>opt("Moderate",k,note(left(k)),k,false)).join("")}${opt("Expensive","Restaurant","higher-cost option","Restaurant",false)}
  <p class="m">It's your choice. Nothing is blocked.</p>`}
 return`<div class="ov" onclick="if(event.target==this){S.sheet=null;render()}"><div class="sh">${h}</div></div>`}
const mname=id=>S.people.find(p=>p.id==id)?.name||"Friend";
function render(){
 if(!S.user)return void(app.innerHTML=authV());
 if(!S.room)return void(app.innerHTML=S.pending?waitV():roomV());
 if(!stats(S.user.id,CUR).b)return void(app.innerHTML=`<div class="wrap"><h1>New month 🗓️</h1><p class="m">Set your budget for ${mlabel(CUR)}.</p>${planForm()}</div>`);
 app.innerHTML=(S.view=="p"?person():home())+sheetV();
}

/* ---------- actions ---------- */
async function auth(){
 const email=$("#em").value.trim(),password=$("#pw").value,name=S.signup?$("#nm").value.trim():"";
 if(!/^\S+@\S+\.\S+$/.test(email))return flash("Enter a valid email");
 if(password.length<6)return flash("Password needs at least 6 characters");
 if(S.signup&&!name)return flash("Enter your name");
 const r=S.signup?await db.auth.signUp({email,password,options:{data:{name}}}):await db.auth.signInWithPassword({email,password});
 if(r.error)return flash(r.error.message);
 if(!r.data.session)return flash("Check your email to confirm, then log in");
 S.user=r.data.user;await load();render();
}
async function out(){await db.auth.signOut();S.user=null;S.room=null;S.view="home";S.sheet=null;render()}
async function mkRoom(){const{error}=await db.rpc("create_room");if(error)return flash(error.message);await load();render()}
async function joinRoom(){const c=$("#code").value.trim();if(!c)return flash("Enter the room code");const{error}=await db.rpc("join_room",{p_code:c});if(error)return flash(error.message);await load();render();flash("Request sent ✓ Waiting for the host");$(".toast").style.background="var(--ok)"}
async function recheck(){await load();render()}
async function cancelReq(){const{error}=await db.from("join_requests").delete().eq("user_id",S.user.id);if(error)return flash(error.message);await load();render()}
async function approve(uid){const{error}=await db.rpc("approve_join",{p_user:uid});if(error)return flash(error.message);await load();render()}
async function decline(uid){const{error}=await db.from("join_requests").delete().eq("user_id",uid);if(error)return flash(error.message);await load();render()}
async function removeMember(uid){if(!confirm("Remove "+mname(uid)+" from the room? They will lose access to it."))return;const{error}=await db.rpc("remove_member",{p_user:uid});if(error)return flash(error.message);await load();render()}
async function resetCode(){if(!confirm("Make a new room code? The old code and invite link will stop working."))return;const{error}=await db.rpc("reset_code");if(error)return flash(error.message);await load();render();flash("New code ready ✓");$(".toast").style.background="var(--ok)"}
async function savePlan(){
 const g=id=>$("#"+id).value.trim(),n=v=>v===""?null:Number(v),amount=Number(g("bud")),fb=n(g("fb"));
 if(!(amount>0&&amount<=1e7))return flash("Enter your monthly budget");
 if(fb!==null&&!(fb>=0))return flash("Check the food budget");
 const fp={};
 for(const r of S.plan){const nm=r.n.trim();if(!nm&&r.c==="")continue;
  if(!nm||r.c==="")return flash("Fill in both the meal name and how many times");
  const c=Number(r.c);if(!Number.isInteger(c)||c<0||c>99)return flash("Meal counts must be whole numbers from 0 to 99");
  if(BASEFOOD.some(x=>x.toLowerCase()==nm.toLowerCase()))return flash(nm+" is already a built-in option, choose another name");
  if(Object.keys(fp).some(x=>x.toLowerCase()==nm.toLowerCase()))return flash("You listed "+nm+" twice");
  fp[nm]=c}
 const{error}=await db.from("budgets").upsert({user_id:S.user.id,month:CUR,amount,food_budget:fb,food_plan:fp,chicken_plan:null,fish_plan:null});
 if(error)return flash(error.message);S.sheet=null;await load();render();
}
async function saveExp(){
 const amount=parseFloat($("#amt").value),category=$("#cat").value,n=new Date();
 if(!(amount>0&&amount<=1e6))return flash("Enter an amount above 0");
 const{error}=await db.from("expenses").insert({user_id:S.user.id,amount,category,food_type:category=="Food"?$("#ft").value:null,note:$("#note").value.trim()||null,spent_on:ym(n)+"-"+pad(n.getDate()),month:ym(n)});
 if(error)return flash(error.message);S.sheet=null;S.month=CUR;await load();render();
}
async function del(id){if(!confirm("Delete this expense?"))return;const{error}=await db.from("expenses").delete().eq("id",id);if(error)return flash(error.message);await load();render()}
async function saveLoan(){
 const amount=parseFloat($("#lamt").value),k=$("#lk").value,me=S.user.id,o={id:S.sheet?.to};
 if(!o.id)return flash("Pick a person first");
 if(!(amount>0&&amount<=1e6))return flash("Enter an amount above 0");
 const m={lend:["loan",me,o.id],theypay:["repay",o.id,me],borrow:["loan",o.id,me],ipay:["repay",me,o.id]}[k];
 const{error}=await db.from("loans").insert({room_id:S.roomId,created_by:me,kind:m[0],from_user:m[1],to_user:m[2],amount,note:$("#lnote").value.trim()||null});
 if(error)return flash(error.message);S.sheet=null;await load();render();
}
async function delLoan(id){if(!confirm("Delete this entry?"))return;const{error}=await db.from("loans").delete().eq("id",id);if(error)return flash(error.message);await load();render()}
async function sendRem(msg){
 msg=(msg||"").trim().slice(0,200);if(!msg)return flash("Write a message first");
 const to=S.sheet?.to;if(!to)return flash("Pick a person first");
 const last=S.rem.find(r=>r.from_user==S.user.id&&r.to_user==to),wait=last?60-(Date.now()-new Date(last.created_at))/6e4:0;
 if(wait>0)return flash("Wait "+Math.ceil(wait)+" more min before another reminder");
 const{error}=await db.from("reminders").insert({room_id:S.roomId,from_user:S.user.id,to_user:to,message:msg});
 if(error)return flash(error.message);S.sheet=null;await load();render();flash("Reminder sent ✓");$(".toast").style.background="var(--ok)";
}
async function openInbox(){S.sheet={t:"inbox"};render();await db.from("reminders").update({read:true}).eq("to_user",S.user.id).eq("read",false);await load();render()}
function share(){const u=location.origin+location.pathname+"?join="+S.room.code;if(navigator.share)navigator.share({title:"Financial Independence",text:"Join my room",url:u}).catch(()=>{});else{navigator.clipboard?.writeText(u);flash("Link copied")}}

(async()=>{
 if(SB_URL.startsWith("PASTE")){app.innerHTML=`<div class="wrap"><h1>Almost there</h1><p class="m">Paste your Supabase URL and key at the top of index.html.</p></div>`;return}
 const{data:{session}}=await db.auth.getSession();S.user=session?.user||null;
 if(S.user)await load();render();
 setInterval(async()=>{if(S.user&&S.room&&!S.sheet&&S.view=="home"&&stats(S.user.id,CUR).b){await load();render()}else if(S.user&&!S.room&&S.pending){await load();render()}},20000);
})();
